[package]
name = "cctv-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "Metadata API for cctv-stream: sync, heartbeat, snapshot, WebSocket, health"

[[bin]]
name = "cctv-server"
path = "src/main.rs"

[lib]
name = "cctv_server"
path = "src/lib.rs"

[workspace]

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
contracts = { path = "../contracts" }
futures-util = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"