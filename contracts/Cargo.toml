[package]
name = "contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false
description = "JSON Schema contracts and fixtures shared by the Rust core, Android app, and sync server"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# Default features pull in HTTP retrieval and aws-lc-rs (CMake/NASM). The crate
# validates against an in-memory registry only, so the TLS stack is dead weight.
jsonschema = { version = "0.63.1", default-features = false }
serde_json = "1.0"
thiserror = "2.0"