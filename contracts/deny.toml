# Dependency policy for the contract validation crate.
#
# This crate is host tooling and a future server dependency: it is not linked
# into the Android APK. Run from `contracts/`: `cargo deny check`.

[advisories]
version = 2

[licenses]
version = 2
confidence-threshold = 0.93
# This crate is not published; its own manifest has no `license` field.
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]

# `r-efi` is pulled in by `getrandom` for WASI targets only. It is never
# compiled for Windows, Linux, or Android, so LGPL is scoped to that one crate
# instead of being allowed globally.
[[licenses.exceptions]]
crate = "r-efi"
allow = ["LGPL-2.1-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]