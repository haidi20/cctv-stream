[workspace]
members = ["stream-engine", "ai-engine", "spatial-engine", "core-ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.96"
publish = false

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
retina = "0.4.22"
# retina 0.4.22 builds `HexConfig` without `autoskip`; pretty-hex 0.4.3 added
# the field, so pin the last compatible patch release.
pretty-hex = "=0.4.2"
tokio = { version = "1.54", features = ["rt-multi-thread", "time", "sync", "macros"] }
url = "2"
uniffi = { version = "0.32.2", features = ["tokio"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
