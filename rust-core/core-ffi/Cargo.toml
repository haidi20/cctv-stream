[package]
name = "core-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
ai-engine = { path = "../ai-engine" }
serde_json.workspace = true
spatial-engine = { path = "../spatial-engine" }
stream-engine = { path = "../stream-engine" }
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util.workspace = true
uniffi.workspace = true

[features]
default = []
# Live RTSP ingestion is opt-in, matching `stream-engine`. The Kotlin MVP uses
# Media3 for preview and does not call the Rust RTSP path yet.
rtsp = ["stream-engine/rtsp"]
# Host-only binding generator. Never enabled for `cargo ndk` builds, so the
# Android cdylib does not pull in `uniffi_bindgen`, `askama`, or `cargo_metadata`.
cli = ["uniffi/cli"]
